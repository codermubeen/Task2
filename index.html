
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <header class="calculator-header">
            <h1>Calculator</h1>
            <span>STANDARD</span>
        </header>

        <section class="display" aria-label="Calculator display">
            <div id="expression" class="expression"
                 aria-live="polite"></div>
            <output id="result" class="result"
                    aria-live="polite">0</output>
        </section>

        <section class="buttons" aria-label="Calculator buttons">
            <button class="utility" data-action="clear">AC</button>
            <button class="utility" data-action="delete">DEL</button>
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">x</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">-</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-action="sign">+/-</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equals" data-action="calculate">=</button>
        </section>

        <p class="hint">Keyboard supported · Press Esc to clear</p>
    </main>

    <script src="script.js"></script>

</body>
</html>
